<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c4dff"><title>Španielčina · Barbi učenie</title><style>
:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#35294b;background:#fff1f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#ffe6f2,#e9e2ff)}main{max-width:780px;margin:auto;padding:20px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{color:#7044db;font-size:1.65rem}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:13px 18px;background:#7950df;color:white;font-weight:bold}button:disabled{opacity:.45;cursor:default}.back{background:white;color:#6340b7;box-shadow:0 2px 8px #0001}.card{background:white;padding:22px;border-radius:22px;box-shadow:0 5px 18px #54326d18;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{background:white;text-align:left;color:#382952;min-height:155px;box-shadow:0 4px 16px #54326d22;display:flex;flex-direction:column;gap:8px}.tile b{font-size:1.15rem}.tile small{font-weight:normal;color:#72677f}.emoji{font-size:2.1rem}.muted{color:#746982}.pill{border-radius:99px;padding:5px 12px;background:#f0e9ff;color:#6340b7;font-size:.83rem;font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.speak{padding:9px 12px;background:#f0e9ff;color:#5c3db2;white-space:nowrap}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#f6f0ff;color:#35294b;border:2px solid transparent}.choice.selected{border-color:#7950df;background:#eae0ff}input{width:100%;border:2px solid #e7d9ff;border-radius:13px;padding:13px;color:#35294b}input:focus{outline:2px solid #7950df}.bar{height:10px;background:#efe7ff;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#8c64e9;transition:width .3s}.good{color:#15803d}.hint{background:#fff7e4;border-radius:15px;padding:14px;margin:12px 0}.pron{font-size:.85rem;color:#746982}.action{margin-top:16px}.examples{display:grid;gap:9px}.example{padding:12px;background:#f7f2ff;border-radius:13px}.stat{font-size:.85rem;color:#706584}@media(max-width:470px){.grid{gap:9px}.tile{padding:14px;min-height:165px}.card{padding:17px}h1{font-size:1.35rem}}</style></head><body><main><header><a class="back" id="back" href="./" style="text-decoration:none;display:inline-block">← Späť</a><h1>🇪🇸 Barbi · Španielčina</h1></header><div id="root"><div class="card"><h2>¡Hola, Barbi! 💜</h2><p>Vyber si lekciu:</p><div class="grid"><button class="tile" onclick="window.barbiStart(0)">🔢 Čísla 1–20</button><button class="tile" onclick="window.barbiStart(1)">👋 Pozdravy a frázy</button><button class="tile" onclick="window.barbiStart(2)">🧒 Osobné zámená</button><button class="tile" onclick="window.barbiStart(3)">📚 Tri dôležité slovesá</button></div></div></div></main><script>
(function(){
const lessons=[
{title:"Čísla 1–20",icon:"🔢",description:"Počítaj po španielsky",intro:"Španielske čísla sa učíme postupne. Klikni na 🔊 a počúvaj. Potom si skús, čo si zapamätala.",items:[["uno","jeden","uno"],["dos","dva","dos"],["tres","tri","tres"],["cuatro","štyri","kuatro"],["cinco","päť","sinko"],["seis","šesť","sejs"],["siete","sedem","sjete"],["ocho","osem","očo"],["nueve","deväť","nueve"],["diez","desať","djes"],["once","jedenásť","onse"],["doce","dvanásť","dose"],["trece","trinásť","trese"],["catorce","štrnásť","katorse"],["quince","pätnásť","kinse"],["dieciséis","šestnásť","djesisejs"],["diecisiete","sedemnásť","djesisjete"],["dieciocho","osemnásť","djesiočo"],["diecinueve","devätnásť","djesinueve"],["veinte","dvadsať","bejn-te"]]},
{title:"Pozdravy a frázy",icon:"👋",description:"Predstav sa a pozdrav",intro:"V španielčine sa môžeme pozdraviť, rozlúčiť aj predstaviť. Všimni si otáznik ¿ na začiatku otázky.",items:[["Hola","Ahoj","ola"],["Buenos días","Dobré ráno / dobrý deň","buenos días"],["Buenas tardes","Dobré popoludnie","buenas tardes"],["Buenas noches","Dobrý večer / dobrú noc","buenas nočes"],["Adiós","Dovidenia","adiós"],["Hasta luego","Uvidíme sa neskôr","asta luego"],["¿Cómo estás?","Ako sa máš?","komo estás"],["Estoy bien, gracias.","Mám sa dobre, ďakujem.","estoj bjen, grasjas"],["¿Cómo te llamas?","Ako sa voláš?","komo te jamas"],["Me llamo Barbora.","Volám sa Barbora.","me jamo Barbora"],["¿De dónde eres?","Odkiaľ si?","de donde eres"],["Soy de Eslovaquia.","Som zo Slovenska.","soj de eslovakja"],["Mucho gusto","Teší ma","mučo gusto"],["Gracias","Ďakujem","grasjas"],["Por favor","Prosím","por fabor"]]},
{title:"Osobné zámená",icon:"🧒",description:"Ja, ty, on, ona, my, vy, oni",intro:"Zámená nám hovoria, kto vykonáva dej. V španielčine sa často môžu vynechať, lebo osobu prezrádza tvar slovesa.",items:[["yo","ja","jo"],["tú","ty","tu"],["él","on","el"],["ella","ona","eja"],["usted","Vy (zdvorilo, jednotné číslo)","usted"],["nosotros","my (chlapci alebo zmiešaná skupina)","nosotros"],["nosotras","my (dievčatá)","nosotras"],["vosotros","vy (chlapci alebo zmiešaná skupina)","bosotros"],["vosotras","vy (dievčatá)","bosotras"],["ellos","oni (chlapci alebo zmiešaná skupina)","ejos"],["ellas","ony (dievčatá)","ejas"],["ustedes","Vy (množné číslo)","ustedes"]]},
{title:"Tri dôležité slovesá",icon:"📚",description:"SER · TENER · LLAMARSE",intro:"SER znamená byť, TENER mať a LLAMARSE volať sa. V každej osobe sa ich tvar mení. LLAMARSE je zvratné sloveso – preto má me, te, se, nos, os, se.",items:[["yo soy","ja som","jo soj"],["tú eres","ty si","tu eres"],["él / ella es","on / ona je","el eja es"],["nosotros somos","my sme","nosotros somos"],["vosotros sois","vy ste","bosotros sois"],["ellos / ellas son","oni / ony sú","ejos ejas son"],["yo tengo","ja mám","jo tengo"],["tú tienes","ty máš","tu tjenes"],["él / ella tiene","on / ona má","el eja tjene"],["nosotros tenemos","my máme","nosotros tenemos"],["vosotros tenéis","vy máte","bosotros tenejs"],["ellos / ellas tienen","oni / ony majú","ejos ejas tjenen"],["yo me llamo","ja sa volám","jo me jamo"],["tú te llamas","ty sa voláš","tu te jamas"],["él / ella se llama","on / ona sa volá","el eja se jama"],["nosotros nos llamamos","my sa voláme","nosotros nos jamamos"],["vosotros os llamáis","vy sa voláte","bosotros os jamajs"],["ellos / ellas se llaman","oni / ony sa volajú","ejos ejas se jaman"]]}];
const KEY="barbi-spanish-progress-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}let current=-1,queue=[],step=0,choice="",mistakes=0,mode="";const root=document.getElementById("root"),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(saved))}function say(s,slow=false){if(!("speechSynthesis"in window)){alert("Tento prehliadač nepodporuje hlasové čítanie.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang="es-ES";u.rate=slow?.72:.9;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase()==="es-es")||voices.find(v=>v.lang.startsWith("es"));if(v)u.voice=v;speechSynthesis.speak(u)}
function speakButtons(s){return '<button class="speak" data-say="'+esc(s)+'" aria-label="Prehrať výslovnosť">🔊 Počúvaj</button><button class="speak" data-slow="'+esc(s)+'" aria-label="Pomaly prehrať">🐢 Pomaly</button>'}
document.addEventListener("click",e=>{let b=e.target.closest("[data-say],[data-slow]");if(b){say(b.dataset.say||b.dataset.slow,!!b.dataset.slow)}});document.getElementById("back").onclick=e=>{if(current!==-1){e.preventDefault();current=-1;home()}};function stats(i){let p=saved[i]||{};return p.done||0}
function home(){current=-1;root.innerHTML='<div class="card"><h2>¡Hola, Barbi! 💜</h2><p>Vyber si, čo sa dnes naučíš. Bez známok, bez stresu. Každý pokus sa počíta!</p></div><div class="grid">'+lessons.map((l,i)=>'<button class="tile" data-lesson="'+i+'"><span class="emoji">'+l.icon+'</span><b>'+l.title+'</b><small>'+l.description+'</small><span class="pill">'+(stats(i)?'Zvládnuté: '+stats(i)+' slov / tvarov':'Začať lekciu')+'</span></button>').join("")+'</div>';root.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>start(+b.dataset.lesson))}
function start(i){current=i;step=0;mistakes=0;mode="learn";queue=lessons[i].items.map((_,n)=>n);showLearn()}
function lessonHeader(){return '<p class="muted">'+lessons[current].icon+' '+lessons[current].title+'</p>'}
function showLearn(){let l=lessons[current];root.innerHTML=lessonHeader()+'<div class="card"><span class="pill">1. Najprv sa naučíme</span><h2>'+l.title+'</h2><p>'+l.intro+'</p><div class="examples">'+l.items.map(([es,sk,pr])=>'<div class="example"><div class="row"><div><b>'+esc(es)+'</b><div class="muted">'+esc(sk)+'</div><div class="pron">Približne: '+esc(pr)+'</div></div><div>'+speakButtons(es)+'</div></div></div>').join("")+'</div><button class="action" id="go">Idem si to vyskúšať →</button></div>';document.getElementById("go").onclick=()=>{mode="quiz";step=0;showQuestion()}}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function question(){let idx=queue[step],l=lessons[current],item=l.items[idx];let type=step%3===1?"fill":"pick";let options=shuffle([idx,...shuffle(l.items.map((_,i)=>i).filter(i=>i!==idx)).slice(0,2)]);return{idx,item,type,options}}
let q=null;function showQuestion(){if(step>=queue.length){finish();return}q=question();choice="";let [es,sk,pr]=q.item;let pct=Math.round(step/queue.length*100);root.innerHTML=lessonHeader()+'<div class="card"><div class="row"><span class="pill">2. Skúšame spolu</span><span class="stat">'+(step+1)+' / '+queue.length+'</span></div><div class="bar" style="margin:15px 0"><div style="width:'+pct+'%"></div></div><h2>'+ (q.type==="fill"?'Doplň správny španielsky výraz':'Ktorá odpoveď je správna?')+'</h2><p>Ako sa po španielsky povie <b>'+esc(sk)+'</b>?</p>'+(q.type==="fill"?'<input id="fill" type="text" autocomplete="off" autocapitalize="off" placeholder="Napíš odpoveď…">':'<div id="opts">'+q.options.map(i=>'<button class="choice" data-choice="'+i+'">'+esc(lessons[current].items[i][0])+'</button>').join("")+'</div>')+'<div id="feedback"></div><button class="action" id="check" disabled>Skontrolovať ✓</button></div>';if(q.type==="fill"){let f=document.getElementById("fill");f.oninput=()=>{choice=f.value;document.getElementById("check").disabled=!choice.trim()};f.onkeydown=e=>{if(e.key==="Enter")document.getElementById("check").click()}}else root.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{choice=String(b.dataset.choice);root.querySelectorAll("[data-choice]").forEach(x=>x.classList.toggle("selected",x===b));document.getElementById("check").disabled=false});document.getElementById("check").onclick=check}
function normalize(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim()}function check(){let ok=q.type==="pick"?Number(choice)===q.idx:normalize(choice)===normalize(q.item[0]);let f=document.getElementById("feedback");if(!ok){mistakes++;saved[current]??={};saved[current].wrong??={};saved[current].wrong[q.idx]=(saved[current].wrong[q.idx]||0)+1;save();f.innerHTML='<div class="hint">💛 To nevadí! Správna odpoveď je <b>'+esc(q.item[0])+'</b> ('+esc(q.item[1])+').<p>'+speakButtons(q.item[0])+'</p>Vrátime sa k nej ešte raz, aby si si ju zapamätala.</div>';queue.push(q.idx);let b=document.getElementById("check");b.textContent="Pokračovať →";b.disabled=false;b.onclick=()=>{step++;showQuestion()}}else{saved[current]??={};saved[current].done=Math.max(saved[current].done||0,step+1);save();f.innerHTML='<div class="hint good">🌟 ¡Muy bien! Správne! '+esc(q.item[0])+' '+speakButtons(q.item[0])+'</div>';let b=document.getElementById("check");b.textContent="Ďalej →";b.onclick=()=>{step++;showQuestion()}}}
function finish(){let l=lessons[current];saved[current]??={};saved[current].done=l.items.length;saved[current].sessions=(saved[current].sessions||0)+1;save();root.innerHTML=lessonHeader()+'<div class="card" style="text-align:center"><div style="font-size:3.5rem">🎉</div><h2>¡Fantástico, Barbi!</h2><p>Prešla si všetky slovíčka a tvary. '+(mistakes?'Niektoré si si zopakovala a nakoniec zvládla. To je učenie!':'Všetko si zvládla na prvýkrát!')+'</p><p class="pill">Precvičené: '+l.items.length+' · Opakovania: '+mistakes+'</p><div class="row" style="justify-content:center;margin-top:18px"><button id="again">Zopakovať lekciu</button><button class="back" id="all">Všetky lekcie</button></div></div>';document.getElementById("again").onclick=()=>start(current);document.getElementById("all").onclick=home}
window.barbiStart=start;
try{home()}catch(error){document.getElementById("root").innerHTML="<div class=\"card\"><h2>Niečo sa nepodarilo načítať</h2><p>Obnov stránku (Ctrl + F5). Ak problém trvá, napíš nám.</p></div>";console.error(error)}
})();
</script></body></html>
