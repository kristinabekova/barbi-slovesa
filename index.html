<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barbi učenie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Barbi učenie</title>
<style>
  :root {
    --bg1: #fdeaf6; --bg2: #e7e0ff; --card: #fff; --pink: #ff5fae; --purple: #7c4dff;
    --good: #16a34a; --bad: #dc2626; --warn: #f59e0b; --text: #33274a; --muted: #7a6f90; --line: #eadff7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--text);
         background: linear-gradient(160deg, var(--bg1), var(--bg2)); min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; max-width: 820px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.35rem; color: var(--purple); cursor: pointer; }
  #streak { background: #fff; padding: 6px 14px; border-radius: 999px; font-weight: bold; box-shadow: 0 2px 8px #0002; font-size: .95rem; }
  main { max-width: 820px; margin: 0 auto; padding: 0 16px 50px; }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; }
  input[type=text], input[type=search], select { font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); width: 100%; background: #fff; color: var(--text); }
  input:focus, select:focus { outline: 0; border-color: var(--purple); }
  h2 { margin: 6px 0 12px; }
  .card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: 0 4px 16px #0002; margin-bottom: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 2rem; color: var(--purple); }
  .stat span { color: var(--muted); font-size: .9rem; }
  .btn { background: var(--pink); color: #fff; padding: 13px 22px; border-radius: 999px; font-size: 1.05rem; font-weight: bold; box-shadow: 0 3px 0 #c43c86; }
  .btn.alt { background: var(--purple); box-shadow: 0 3px 0 #5a33c9; }
  .btn.ghost { background: #fff; color: var(--text); box-shadow: 0 2px 6px #0003; }
  .btn.good { background: var(--good); box-shadow: 0 3px 0 #0f7a38; }
  .btn.bad { background: var(--bad); box-shadow: 0 3px 0 #a31a1a; }
  .btn:disabled { opacity: .4; cursor: default; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .menu button { background: #fff; border-radius: 20px; padding: 22px 10px; box-shadow: 0 4px 14px #0002; font-size: 1.1rem; font-weight: bold; }
  .menu button span { display: block; font-size: 2.4rem; margin-bottom: 4px; }
  .menu button:hover { transform: translateY(-2px); }
  .back { background: #fff; border-radius: 999px; padding: 8px 16px; margin: 4px 0 10px; box-shadow: 0 2px 6px #0002; }
  .bar { height: 14px; background: #eee6fb; border-radius: 99px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .m { background: var(--good); } .a { background: #86d98f; } .l { background: var(--warn); }
  .legend { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 10px; }
  .big { font-size: 2.2rem; font-weight: bold; }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .flash { min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .forms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-top: 10px; }
  .forms div { background: #f6f0ff; border-radius: 14px; padding: 10px 4px; }
  .forms small { display: block; color: var(--muted); font-size: .75rem; }
  .forms b { font-size: 1.35rem; color: var(--purple); }
  .progress { height: 8px; background: #eee6fb; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--purple); transition: width .3s; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .inputs label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .choice { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 16px 8px; font-size: 1.3rem; font-weight: bold; }
  .choice:hover { border-color: var(--purple); }
  .choice.sel { border-color: var(--purple); background: #f1eaff; }
  .grade { font-size: 4.5rem; font-weight: bold; line-height: 1; }
  .g1 { color: var(--good); } .g2 { color: #65a30d; } .g3 { color: var(--warn); } .g4 { color: #ea580c; } .g5 { color: var(--bad); }
  .mistake { border-left: 5px solid var(--bad); padding: 6px 12px; margin: 8px 0; background: #fff5f5; border-radius: 8px; }
  .okline { border-left: 5px solid var(--good); padding: 6px 12px; margin: 8px 0; background: #f0fdf4; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: .8rem; }
  .spk { background: none; font-size: 1.1rem; padding: 2px 6px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 8px; }
  .chart div { flex: 1; border-radius: 6px 6px 0 0; min-height: 4px; position: relative; }
  .chart div span { position: absolute; top: -18px; width: 100%; text-align: center; font-size: .72rem; color: var(--muted); }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .8rem; color: #fff; }
  .word { display: flex; gap: 4px; margin: 4px 0 2px; }
  .word .lt { flex: 1 1 0; min-width: 0; max-width: 38px; height: 48px; text-align: center; font-size: 1.45rem; font-weight: bold; border-radius: 10px; padding: 0; font-family: 'Courier New', monospace; }
  .word input.lt { border: 2px solid var(--line); background: #fff; color: var(--text); width: auto; }
  .word input.lt:focus { border-color: var(--purple); background: #f6f0ff; }
  .word input.lt.bad { border-color: var(--warn); background: #fffbeb; }
  .word .fixed { display: flex; align-items: center; justify-content: center; background: #ece4ff; color: var(--purple); }
  .word .fixed.done { background: #dcfce7; color: var(--good); }
  .word .gap { flex: 0 0 12px; }
  .menu.two { grid-template-columns: 1fr 1fr; }
  .menu.two button { padding: 28px 8px; font-size: 1.35rem; }
  .menu.two button small { display: block; font-size: .8rem; font-weight: normal; color: var(--muted); margin-top: 4px; }
  .fld { text-align: left; margin: 14px 0; }
  .fld label { font-size: .85rem; color: var(--muted); display: block; }
  .mask { font-family: "Courier New", monospace; font-size: 1.7rem; font-weight: bold; letter-spacing: .1em; color: var(--purple); margin: 2px 0 6px; word-break: break-all; }
  .fld input.ok { border-color: var(--good); background: #f0fdf4; }
  .fld input.try { border-color: var(--warn); background: #fffbeb; }
  .tip { background: #fff8e1; border-radius: 14px; padding: 12px 14px; margin: 12px 0; text-align: left; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: #f6f0ff; border-radius: 12px; padding: 6px 10px; font-size: .95rem; }
  .hint { min-height: 1.4rem; margin: 10px 0 4px; font-size: 1.2rem; font-weight: bold; color: var(--purple); letter-spacing: .08em; }
  .choice.gone { opacity: .2; pointer-events: none; text-decoration: line-through; }
  details.card summary { cursor: pointer; font-weight: bold; list-style: none; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card[open] summary { margin-bottom: 8px; }
  .setrow { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .setrow:last-child { border: 0; }
</style>
<style id="language-picker-style">
#language-picker{position:fixed;inset:0;z-index:9999;overflow:auto;background:linear-gradient(155deg,#fdeaf6,#e7e0ff);display:flex;justify-content:center;align-items:center;padding:20px;font-family:"Trebuchet MS",system-ui,sans-serif;color:#33274a}
#language-picker[hidden]{display:none}#language-picker .language-inner{width:min(680px,100%);text-align:center}#language-picker h2{font-size:2.2rem;color:#7c4dff;margin:12px 0}#language-picker .language-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:25px}#language-picker .language-card{border:0;border-radius:24px;padding:30px 12px;background:white;box-shadow:0 6px 22px #0002;cursor:pointer;font:inherit;color:#33274a;text-decoration:none;display:flex;flex-direction:column;gap:12px;align-items:center}#language-picker .language-card strong{font-size:1.3rem}#language-picker .language-card span{font-size:3rem}#language-picker .language-card small{color:#7a6f90}#language-picker .language-card:hover{transform:translateY(-3px)}@media(max-width:440px){#language-picker .language-grid{gap:10px}#language-picker .language-card{padding:22px 8px}}
</style>
</head>
<body>
<div id="language-picker"><div class="language-inner"><div style="font-size:3rem">🦄📚</div><h2>Barbi učenie</h2><p>Čo sa dnes spolu naučíme? 💜</p><div class="language-grid"><button class="language-card" id="english-entry"><span>🇬🇧</span><strong>Angličtina</strong><small>Nepravidelné slovesá</small></button><a class="language-card" href="spanielcina.html"><span>🇪🇸</span><strong>Španielčina</strong><small>4 hravé lekcie</small></a></div></div></div><script>document.addEventListener("DOMContentLoaded",()=>{document.getElementById("english-entry").onclick=()=>{document.getElementById("language-picker").hidden=true};document.getElementById("language-home").onclick=()=>{document.getElementById("language-picker").hidden=false};document.getElementById("logo").addEventListener("click",()=>{document.getElementById("language-picker").hidden=false})});</script>

<header>
  <h1 id="logo">🦄 Barbi učenie</h1>
  <div style="display:flex;gap:10px;align-items:center"><button id="language-home" type="button" style="background:white;color:#7044d9;padding:9px 13px;border-radius:999px;font-weight:bold">🌍 Výber jazyka</button><div id="streak"></div></div>
</header>
<main id="app"></main>

<script>
// ================= DÁTA =================
// base | past simple | past participle | slovensky
const VERBS = `be|was/were|been|byť, existovať
become|became|become|stať sa
begin|began|begun|začať
bite|bit|bitten|hryzť
break|broke|broken|rozbiť
bring|brought|brought|priniesť
build|built|built|stavať
burn|burnt/burned|burnt/burned|horieť
buy|bought|bought|kúpiť
can|could|been able to|môcť
catch|caught|caught|chytiť
come|came|come|prísť
cost|cost|cost|stáť o cene
cut|cut|cut|rezať, strihať
dig|dug|dug|kopať
do|did|done|robiť, urobiť
draw|drew|drawn|kresliť
drink|drank|drunk|piť
drive|drove|driven|jazdiť, šoférovať (auto)
eat|ate|eaten|jesť
fall|fell|fallen|spadnúť
feel|felt|felt|cítiť
fight|fought|fought|bojovať
find|found|found|nájsť
fly|flew|flown|lietať
forget|forgot|forgotten|zabudnúť
get|got|got|dostať, získať
give|gave|given|dať, darovať
go|went|been/gone|ísť
grow|grew|grown|rásť, pestovať
have|had|had|mať
hear|heard|heard|počuť
hide|hid|hidden|ukryť sa
hit|hit|hit|trafiť
hold|held|held|držať
hurt|hurt|hurt|zraniť
keep|kept|kept|držať, dodržať
know|knew|known|vedieť
learn|learnt/learned|learnt/learned|učiť sa
leave|left|left|odísť, opustiť
lie|lay|lain|ležať
lose|lost|lost|stratiť
make|made|made|robiť, vyrobiť
mean|meant|meant|mať niečo na mysli
meet|met|met|stretnúť sa
pay|paid|paid|platiť
put|put|put|položiť
read|read|read|čítať
ride|rode|ridden|jazdiť (bicykel)
ring|rang|rung|zvoniť
run|ran|run|utekať
say|said|said|povedať
see|saw|seen|vidieť
sell|sold|sold|predávať, predať
send|sent|sent|poslať
set|set|set|nastaviť
sing|sang|sung|spievať
sink|sank|sunk|potopiť
sit|sat|sat|sedieť
sleep|slept|slept|spať
smell|smelt/smelled|smelt/smelled|cítiť (vôňu)
speak|spoke|spoken|hovoriť
spell|spelt/spelled|spelt/spelled|hláskovať
spend|spent|spent|stráviť, minúť
stand|stood|stood|stáť
steal|stole|stolen|kradnúť
stick|stuck|stuck|prepichnúť, prilepiť
sweep|swept|swept|zametať
swim|swam|swum|plávať
take|took|taken|zobrať
teach|taught|taught|učiť (keď učí učiteľ)
tear|tore|torn|trhať, roztrhať
tell|told|told|povedať
think|thought|thought|myslieť
throw|threw|thrown|hodiť
understand|understood|understood|rozumieť
wake|woke|woken|zobudiť
wear|wore|worn|nosiť, mať oblečené
win|won|won|vyhrať
write|wrote|written|napísať
choose|chose|chosen|vybrať`.split("\n").map(l => { const [base, past, pp, sk] = l.split("|"); return { base, past, pp, sk }; });

const byBase = Object.fromEntries(VERBS.map(v => [v.base, v]));
// Desiatky podľa poradia v zozname: 1–10, 11–20, …
VERBS.forEach((v, i) => v.n = i + 1);
const SETS = [];
for (let i = 0; i < VERBS.length; i += 10) {
  const end = VERBS.length - (i + 10) < 5 ? VERBS.length : i + 10;
  const verbs = VERBS.slice(i, end);
  SETS.push({ id: "s" + SETS.length, name: `${verbs[0].n}–${verbs[verbs.length - 1].n}`, verbs });
  i = end - 10;
}

// Výber desiatok zaklikávaním; vráti funkciu, ktorá dá aktuálne vybrané slovesá
function rangePicker(el) {
  el.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn ghost" id="selAll" style="padding:8px 14px;font-size:.9rem">Označiť všetko</button>
      <button class="btn ghost" id="selNone" style="padding:8px 14px;font-size:.9rem">Zrušiť výber</button>
    </div>
    ${SETS.map(s => { const c = counts(s.verbs); return `<label class="card setrow" style="display:block;cursor:pointer;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px"><input type="checkbox" data-id="${s.id}" style="width:22px;height:22px">
      <b style="font-size:1.1rem">${s.name}</b><span class="muted" style="margin-left:auto;font-size:.85rem">${c.mastered}/${s.verbs.length} zvládnuté</span></div>
      <div class="muted" style="font-size:.85rem;margin:4px 0 6px 32px">${s.verbs.map(v => v.base).join(", ")}</div>
      <div style="margin-left:32px">${barHtml(c)}</div></label>`; }).join("")}
    <div class="muted" id="selInfo" style="margin:6px 0"></div>`;
  const boxes = [...el.querySelectorAll("input[type=checkbox]")];
  const get = () => boxes.filter(b => b.checked).flatMap(b => SETS.find(s => s.id === b.dataset.id).verbs);
  const upd = () => { const n = get().length; el.querySelector("#selInfo").textContent = n ? `Vybrané: ${n} slovies` : "Zakliknite aspoň jednu desiatku."; };
  boxes.forEach(b => b.onchange = upd);
  el.querySelector("#selAll").onclick = () => { boxes.forEach(b => b.checked = true); upd(); };
  el.querySelector("#selNone").onclick = () => { boxes.forEach(b => b.checked = false); upd(); };
  upd();
  return get;
}

// ================= ULOŽENIE =================
const KEY = "barbi-verbs-v1";
let store = { v: {}, tests: [], days: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v) store = s; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const today = () => new Date().toISOString().slice(0, 10);
function markDay() { if (!store.days.includes(today())) { store.days.push(today()); save(); } }
function getP(base) { return store.v[base] || (store.v[base] = { box: 0, ok: 0, bad: 0 }); }
function status(base) {
  const p = store.v[base];
  if (!p || (!p.ok && !p.bad)) return "new";
  if (p.box >= 4) return "mastered";
  if (p.box >= 2) return "almost";
  return "learning";
}
function record(base, ok, maxBox = 5, hinted = false) {
  const p = getP(base);
  if (ok && hinted) { p.ok++; }  // správne, ale s nápovedou: slovo sa neposúva do vyššej úrovne
  else if (ok) { p.ok++; p.box = Math.min(maxBox, Math.max(p.box, p.box + 1)); }
  else { p.bad++; p.box = Math.max(0, p.box - 2); }
  p.last = today();
}
function streak() {
  let n = 0; const d = new Date();
  if (!store.days.includes(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (store.days.includes(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function counts(verbs) {
  const c = { new: 0, learning: 0, almost: 0, mastered: 0 };
  verbs.forEach(v => c[status(v.base)]++);
  return c;
}

// ================= POMOCNÉ =================
const $app = document.getElementById("app");
const $streak = document.getElementById("streak");
document.getElementById("logo").onclick = () => home();
function refreshHeader() { const s = streak(); $streak.textContent = s ? `🔥 ${s} ${s === 1 ? "deň" : s < 5 ? "dni" : "dní"} v rade` : "🔥 začni dnes!"; }

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const alts = s => s.split("/");
const showForm = s => s.replace("/", " / ");
function norm(s) { return s.toLowerCase().replace(/[^a-z\/\s,']/g, "").trim(); }
function accepts(input, answer) {
  const ok = alts(answer);
  const full = norm(input).replace(/\s+/g, " ");
  if (ok.includes(full)) return true;
  const phrase = ok.some(a => a.includes(" "));
  const toks = full.split(phrase ? /\s*[\/,]\s*/ : /[\/\s,]+/).filter(Boolean);
  return toks.length > 0 && toks.every(t => ok.includes(t));
}

let voice = null;
function pickVoice() {
  const v = speechSynthesis.getVoices();
  voice = v.find(x => /en-(US|GB)/i.test(x.lang) && /zira|samantha|female|google/i.test(x.name)) || v.find(x => /^en/i.test(x.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.split("/")[0]);
  u.lang = "en-US"; u.rate = 0.85; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
function grade(pct) { return pct >= 90 ? 1 : pct >= 75 ? 2 : pct >= 50 ? 3 : pct >= 30 ? 4 : 5; }
const GRADE_MSG = { 1: "Výborne! 🏆", 2: "Chválitebne, tak ďalej! 👏", 3: "Dobre, ešte to chce trochu cvičenia 💪", 4: "Treba sa viac učiť – pozri si chyby nižšie 📚", 5: "Nevadí! Zopakuj si karty a skús znova 🌱" };
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString("sk-SK", { day: "numeric", month: "numeric" }); };
function back(fn, label = "← Späť") { const b = document.createElement("button"); b.className = "back"; b.textContent = label; b.onclick = fn; return b; }
function render(html, backFn) {
  $app.innerHTML = "";
  if (backFn) $app.appendChild(back(backFn));
  const d = document.createElement("div"); d.innerHTML = html; $app.appendChild(d);
  window.scrollTo(0, 0); refreshHeader();
  return d;
}
const barHtml = c => { const t = (c.new + c.learning + c.almost + c.mastered) || 1; return `<div class="bar"><i class="m" style="width:${c.mastered / t * 100}%"></i><i class="a" style="width:${c.almost / t * 100}%"></i><i class="l" style="width:${c.learning / t * 100}%"></i></div>`; };
const LEGEND = `<div class="legend"><b class="m"></b>zvládnuté<b class="a"></b>skoro<b class="l"></b>učím sa<b style="background:#eee6fb"></b>nové</div>`;

// ================= DOMOV =================
function home() {
  const c = counts(VERBS);
  const last = store.tests.slice(-5);
  const avg = last.length ? Math.round(last.reduce((s, t) => s + t.pct, 0) / last.length) : null;
  const weak = VERBS.filter(v => { const p = store.v[v.base]; return p && p.bad && p.box <= 1; }).length;
  const d = render(`
    <p style="font-size:1.25rem;margin:4px 0 12px">Ahoj Barbi! 💖 ${store.tests.length ? "Poďme pokračovať." : "Najprv sa v pokoji poučíš, potom si môžeš skúsiť test."}</p>
    <div class="card">
      <div class="row">
        <div class="stat"><b>${c.mastered}<small style="font-size:1rem;color:var(--muted)"> / ${VERBS.length}</small></b><span>zvládnuté slovesá</span></div>

// Doplňovanie: preklad + tri políčka s napovedanými písmenami, bez skóre a bez času
function initReveal(word, frac) {
  const rev = new Set(), hidden = []; let start = true;
  [...word].forEach((ch, i) => { if (ch === " ") start = true; else if (start) { rev.add(i); start = false; } else hidden.push(i); });
  shuffle(hidden).slice(0, Math.round(hidden.length * frac)).forEach(i => rev.add(i));
  return rev;
}
function maskText(word, rev) { return [...word].map((ch, i) => ch === " " ? " " : rev.has(i) ? ch : "_").join(" "); }

function practice(verbs) {
  const queue = shuffle(verbs), total = verbs.length, extra = {}; let done = 0;
  const next = () => {
    if (!queue.length) {
      markDay(); save();
      const d = render(`<div class="card center"><div class="big">🎉 Super!</div>
        <p>Prešla si všetkých ${total} slovies. Opakovanie je najlepší spôsob, ako si ich zapamätať.</p>
        <p><button class="btn" id="again">Ešte raz</button></p>
        <p><button class="btn alt" id="t">Skúsiť test z týchto slovies</button></p>
        <p><button class="btn ghost" id="h">Domov</button></p></div>`);
      d.querySelector("#again").onclick = () => practice(verbs);
      d.querySelector("#t").onclick = () => startTest(verbs, 15, "Test po učení");
      d.querySelector("#h").onclick = home;
      return;
    }
    const v = queue[0];
    const p = store.v[v.base], box = p ? p.box : 0;
    const frac = extra[v.base] !== undefined ? extra[v.base] : (box >= 4 ? 0 : box >= 2 ? 0.25 : 0.5);
    const fields = [["základný tvar", v.base], ["2. tvar (minulý čas)", v.past], ["3. tvar (príčastie)", v.pp]]
      .map(([label, form]) => ({ label, form, word: alts(form)[0], locked: false, vals: {} }));
    fields.forEach(f => f.rev = initReveal(f.word, frac));
    let revealed = false;

    const d = render(`
      <div class="progress"><i style="width:${done / total * 100}%"></i></div>
      <div class="card center">
        <div class="muted">Doplň písmená do troch tvarov slovesa</div>
        <div class="big" style="margin:4px 0 6px">${v.sk}</div>
        ${fields.map((f, k) => `<div class="fld"><label>${f.label}</label><div class="word" id="w${k}"></div></div>`).join("")}
        <div class="hint" id="msg"></div>
        <div class="row" style="margin-bottom:10px"><button class="btn" id="chk">Skontrolovať</button><button class="btn ghost" id="help">💡 Pomôž mi</button></div>
        <div class="row"><button class="btn ghost" id="trk">🧠 Trik</button><button class="btn ghost" id="show">👀 Ukáž riešenie</button></div>
        <div id="tip"></div>
        <p><button class="btn alt" id="nx" style="display:none">Ďalej ▶</button></p>
      </div>`, home);
    const msg = d.querySelector("#msg");

    // posun medzi prázdnymi políčkami cez všetky tri slová
    const focusNext = (k, i, dir, clear) => {
      const all = [...d.querySelectorAll("input.lt")];
      const idx = all.findIndex(x => +x.dataset.f === k && +x.dataset.i === i);
      const t = all[idx + dir];
      if (!t) return;
      t.focus(); t.select();
      if (clear) { t.value = ""; fields[+t.dataset.f].vals[+t.dataset.i] = ""; t.classList.remove("bad"); }
    };
    const draw = () => fields.forEach((f, k) => {
      const wrap = d.querySelector("#w" + k); wrap.innerHTML = "";
      [...f.word].forEach((ch, i) => {
        if (ch === " ") { const g = document.createElement("span"); g.className = "gap"; wrap.appendChild(g); return; }
        if (f.locked || f.rev.has(i)) {
          const s = document.createElement("span");
          s.className = "lt fixed" + (f.locked ? " done" : ""); s.textContent = ch; wrap.appendChild(s); return;
        }
        const inp = document.createElement("input");
        inp.className = "lt"; inp.maxLength = 1; inp.value = f.vals[i] || "";
        inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.setAttribute("autocorrect", "off"); inp.spellcheck = false;
        inp.dataset.f = k; inp.dataset.i = i;
        inp.oninput = () => {
          const val = inp.value.slice(-1).toLowerCase(); inp.value = val; f.vals[i] = val; inp.classList.remove("bad");
          if (val) focusNext(k, i, 1);
        };
        inp.onfocus = () => inp.select();
        inp.onkeydown = e => {
          if (e.key === "Enter") { e.preventDefault(); check(); }
          else if (e.key === "Backspace" && !inp.value) { e.preventDefault(); focusNext(k, i, -1, true); }
          else if (e.key === "ArrowLeft") { e.preventDefault(); focusNext(k, i, -1); }
          else if (e.key === "ArrowRight") { e.preventDefault(); focusNext(k, i, 1); }
        };
        wrap.appendChild(inp);
      });
    });
    const focusFirst = () => { const f = d.querySelector("input.lt"); if (f) f.focus(); };
    const showTip = () => { d.querySelector("#tip").innerHTML = TIPS[v.base] ? `<div class="tip">🧠 <b>Trik:</b> ${TIPS[v.base]}</div>` : ""; };
    const finishCard = text => {
      msg.textContent = text; showTip();
      d.querySelector("#nx").style.display = ""; d.querySelector("#nx").focus();
      d.querySelector("#chk").style.display = "none"; d.querySelector("#help").style.display = "none"; d.querySelector("#show").style.display = "none";
      say(v.past);
    };
    const check = () => {
      let wrong = 0, empty = 0;
      fields.forEach(f => {
        if (f.locked) return;
        let ok = true;
        [...f.word].forEach((ch, i) => {
          if (ch === " " || f.rev.has(i)) return;
          const val = f.vals[i] || "";
          if (!val) empty++;
          if (val !== ch) ok = false;
        });
        if (ok) f.locked = true; else wrong++;
      });
      draw();
      if (!wrong) { finishCard("Super! 🌟 Zvládla si to."); return; }
      // zlé písmená sa označia oranžovo, správne tvary sa zamknú zelenou
      fields.forEach((f, k) => {
        if (f.locked) return;
        d.querySelectorAll("#w" + k + " input.lt").forEach(inp => {
          const val = f.vals[+inp.dataset.i] || "";
          if (val && val !== f.word[+inp.dataset.i]) inp.classList.add("bad");
        });
      });
      msg.textContent = empty ? "Doplň všetky políčka 😊" : "Skoro! Oranžové písmená oprav alebo si vypýtaj nápovedu 💡";
      const firstBad = d.querySelector("input.lt.bad") || d.querySelector("input.lt");
      if (firstBad) firstBad.focus();
    };
    d.querySelector("#chk").onclick = check;
    d.querySelector("#help").onclick = () => {
      let any = false;
      fields.forEach(f => {
        if (f.locked) return;
        const hid = [...f.word].map((ch, i) => i).filter(i => f.word[i] !== " " && !f.rev.has(i));
        if (hid.length) { const i = hid[Math.floor(Math.random() * hid.length)]; f.rev.add(i); delete f.vals[i]; any = true; }
      });
      draw();
      msg.textContent = any ? "Pridali sme ti jedno písmeno ku každému slovu." : "Už vidíš všetky písmená.";
      focusFirst();
    };
    d.querySelector("#trk").onclick = showTip;
    d.querySelector("#show").onclick = () => {
      revealed = true;
      fields.forEach(f => { f.locked = true; });
      draw();
      finishCard("Nevadí, pozri si to a skús si to zapamätať. Ku slovu sa ešte vrátime 😊");
    };
    d.querySelector("#nx").onclick = () => {
      if (revealed) { extra[v.base] = Math.min(0.8, (extra[v.base] !== undefined ? extra[v.base] : frac) + 0.25); queue.push(queue.shift()); }
      else { queue.shift(); done++; }
      next();
    };
    draw(); focusFirst();
  };
  next();
}

    if (!queue.length) {

      d.querySelector("#t").onclick = () => startTest(verbs, 15, "Test po kartách");

        </div>
      </div>`, home);
    say(v.base);
    d.querySelector("#s0").onclick = () => say(v.base);
    d.querySelector("#flip").onclick = () => {
      d.querySelector("#back").innerHTML = `
        <div class="forms"><div><small>základný</small><b>${v.base}</b></div>
        <div><small>2. tvar (minulý)</small><b>${showForm(v.past)}</b> <button class="spk" data-w="${v.past}">🔊</button></div>
        <div><small>3. tvar (príčastie)</small><b>${showForm(v.pp)}</b> <button class="spk" data-w="${v.pp}">🔊</button></div></div>
        ${TIPS[v.base] ? `<div class="tip">🧠 <b>Trik:</b> ${TIPS[v.base]}</div>` : ""}
        <div class="row" style="margin-top:16px"><button class="btn good" id="y">Vedela som ✅</button><button class="btn bad" id="n">Ešte nie 🔁</button></div>`;
      d.querySelectorAll(".spk[data-w]").forEach(b => b.onclick = () => say(b.dataset.w));
      say(v.past);

      d.querySelector("#n").onclick = () => { v._again = true; again++; queue.push(queue.shift()); next(); };
    };
  };
  next();
}

  const get = rangePicker(d.querySelector("#picker"));
  d.querySelector("#hist").onclick = () => historyView(testMenu);

    startTest(v, 15, title);

function pickWeighted(pool, n) {
  const items = pool.map(v => { const p = store.v[v.base]; let w = 1;
    if (!p || (!p.ok && !p.bad)) w += 2; else { w += (5 - p.box) * 1.5; if (p.bad > p.ok) w += 2; }
    return { v, w }; });
  const out = [];
  while (out.length < n && items.length) {
    const tot = items.reduce((s, i) => s + i.w, 0); let r = Math.random() * tot, k = 0;
    for (; k < items.length - 1; k++) { r -= items[k].w; if (r <= 0) break; }
    out.push(items.splice(k, 1)[0].v);
  }
  return out;
}
function makeQuestion(v) {
  const r = Math.random();
  if (r < 0.5) return { type: "type", v };
  if (r < 0.8) {
    const form = Math.random() < 0.5 ? "past" : "pp";
    const correct = v[form];
    const others = new Set();
    [v.base, v.past, v.pp].forEach(f => { if (f !== correct) others.add(f); });
    const extra = shuffle(VERBS.filter(x => x !== v)).map(x => [x.past, x.pp, x.base][Math.floor(Math.random() * 3)]);
    extra.forEach(f => { if (others.size < 6 && f !== correct && !alts(correct).includes(f)) others.add(f); });
    const opts = shuffle([correct, ...sample([...others], 3)]);
    return { type: "choice", v, form, opts, correct };
  }
  const form = ["base", "past", "pp"][Math.floor(Math.random() * 3)];
  const words = s => s.split(/[\s,()]+/).filter(w => w.length > 2);
  const mine = words(v.sk);
  const wrong = sample(VERBS.filter(x => x !== v && !words(x.sk).some(w => mine.includes(w))), 3).map(x => x.sk);
  return { type: "meaning", v, form, opts: shuffle([v.sk, ...wrong]), correct: v.sk };
}

function startTest(pool, n, title) {
  pool = pool || VERBS;
  if (!pool.length) { alert("Nie je z čoho testovať."); return home(); }
  // každé sloveso aspoň raz, ak je ich menej než otázok, dopĺňame (zakaždým inou otázkou)
  let verbs = pickWeighted(pool, n);
  while (verbs.length < n) verbs = verbs.concat(pickWeighted(pool, n - verbs.length));
  const seen = {};
  const qs = verbs.map(v => {
    let q, tries = 0;
    do { q = makeQuestion(v); tries++; } while (seen[v.base] && seen[v.base].has(q.type + (q.form || "")) && tries < 12);
    (seen[v.base] = seen[v.base] || new Set()).add(q.type + (q.form || ""));
    return q;
  });
  let i = 0; const results = [];
  const ask = () => {
    if (i >= qs.length) return finish();
    const q = qs[i], v = q.v;
    let body = "";
    if (q.type === "type") body = `
      <div class="muted">Napíš 2. a 3. tvar slovesa:</div>
      <div class="big" style="margin:6px 0">${v.base} <button class="spk" id="sp">🔊</button></div>
      <div class="muted">(${v.sk})</div>
      <div class="inputs">
        <div><label>2. tvar (minulý čas)</label><input type="text" id="a1" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div><label>3. tvar (príčastie)</label><input type="text" id="a2" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      </div>`;
    else if (q.type === "choice") body = `
      <div class="muted">Vyber správny ${q.form === "past" ? "2. tvar (minulý čas)" : "3. tvar (príčastie)"} slovesa:</div>
      <div class="big" style="margin:6px 0">${v.base} <button class="spk" id="sp">🔊</button></div>
      <div class="muted">(${v.sk})</div>
      <div class="choices">${q.opts.map((o, k) => `<button class="choice" data-k="${k}">${showForm(o)}</button>`).join("")}</div>`;
    else body = `
      <div class="muted">Čo znamená toto sloveso?</div>
      <div class="big" style="margin:6px 0">${showForm(v[q.form])} <button class="spk" id="sp">🔊</button></div>
      <div class="muted">(${q.form === "base" ? "základný tvar" : q.form === "past" ? "2. tvar" : "3. tvar"})</div>
      <div class="choices">${q.opts.map((o, k) => `<button class="choice" data-k="${k}">${o}</button>`).join("")}</div>`;

    const d = render(`
      <div class="progress"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="card center"><div class="muted">Otázka ${i + 1} / ${qs.length}</div>${body}
        <div class="hint" id="hint"></div>
        <p><button class="btn ghost" id="hintBtn" style="padding:8px 18px;font-size:.95rem">💡 Nápoveda</button></p>
        ${q.type === "type" ? `<button class="btn" id="next">${i === qs.length - 1 ? "Dokončiť" : "Ďalej"}</button>` : ""}</div>`);
    d.querySelector("#sp").onclick = () => say(q.type === "meaning" ? v[q.form] : v.base);
    let hinted = false;
    const push = (ok, given, expected) => { results.push({ base: v.base, type: q.type, ok, given, expected, hint: hinted }); i++; ask(); };
    // nápoveda: pri písaní prvé písmená a dĺžka slov, pri výbere sa vyradí jedna zlá možnosť
    const mask = s => alts(s)[0].split(" ").map(w => w[0] + "_".repeat(w.length - 1)).join("  ");
    d.querySelector("#hintBtn").onclick = e => {
      if (hinted) return;
      hinted = true; e.target.disabled = true; e.target.style.opacity = ".4";
      const hint = d.querySelector("#hint");
      if (q.type === "type") hint.textContent = `2. tvar: ${mask(v.past)}   ·   3. tvar: ${mask(v.pp)}`;
      else {
        const wrong = [...d.querySelectorAll(".choice")].filter(b => q.opts[+b.dataset.k] !== q.correct);
        wrong[Math.floor(Math.random() * wrong.length)].classList.add("gone");
        hint.textContent = "Jednu zlú možnosť sme vyškrtli.";
      }
    };
    if (q.type === "type") {
      const a1 = d.querySelector("#a1"), a2 = d.querySelector("#a2");
      a1.focus();
      a1.onkeydown = e => { if (e.key === "Enter") a2.focus(); };
      const submit = () => {
        const g1 = a1.value.trim(), g2 = a2.value.trim();
        push(accepts(g1, v.past) && accepts(g2, v.pp), `${g1 || "—"} / ${g2 || "—"}`, `${showForm(v.past)} – ${showForm(v.pp)}`);
      };
      a2.onkeydown = e => { if (e.key === "Enter") submit(); };
      d.querySelector("#next").onclick = submit;
    } else {
      d.querySelectorAll(".choice").forEach(b => b.onclick = () => {
        const pick = q.opts[+b.dataset.k];
        const exp = q.type === "choice" ? showForm(q.correct) : q.correct;
        push(pick === q.correct, q.type === "choice" ? showForm(pick) : pick, exp);
      });
    }
  };

  const finish = () => {
    const correct = results.filter(r => r.ok).length, pct = Math.round(correct / results.length * 100), g = grade(pct);
    results.forEach(r => record(r.base, r.ok, r.type === "type" ? 5 : 3, r.hint));
    const mistakes = results.filter(r => !r.ok);
    const hints = results.filter(r => r.hint).length;
    // história sa nikdy neorezáva ani nemaže
    store.tests.push({ ts: Date.now(), date: today(), title, total: results.length, correct, pct, grade: g, hints,
      mistakes: mistakes.map(m => m.base), items: results.map(r => ({ base: r.base, type: r.type, ok: r.ok, given: r.given, expected: r.expected, hint: r.hint })) });
    markDay(); save();
    const d = render(`
      <div class="card center">
        <div class="muted">${title}</div>
        <div class="grade g${g}">${g}</div>
        <div class="big">${correct} / ${results.length} · ${pct} %</div>
        <p>${GRADE_MSG[g]}</p>
        ${hints ? `<p class="muted">💡 Nápovedu si použila pri ${hints} otázkach.</p>` : ""}
      </div>
      ${mistakes.length ? `<div class="card"><h3 style="margin-top:0">Chyby (${mistakes.length})</h3>
        ${mistakes.map(m => { const v = byBase[m.base]; return `<div class="mistake"><b>${v.base}</b> – ${v.sk}<br>
          <span class="muted">tvoja odpoveď:</span> ${m.given}<br><span class="muted">správne:</span> <b>${showForm(v.base)} – ${showForm(v.past)} – ${showForm(v.pp)}</b></div>`; }).join("")}</div>`
        : `<div class="card center">Žiadna chyba! 🌟</div>`}
      <div class="card"><h3 style="margin-top:0">Správne odpovede (${correct})</h3>
        ${results.filter(r => r.ok).map(r => `<div class="okline"><b>${r.base}</b> ✓${r.hint ? " 💡" : ""}</div>`).join("") || "<span class='muted'>—</span>"}</div>
      <div class="row">
        ${mistakes.length ? `<button class="btn alt" id="retry">Zopakovať chyby</button>` : ""}
        <button class="btn" id="again">Nový test</button>
        <button class="btn ghost" id="home">Domov</button>
      </div>`);
    const rt = d.querySelector("#retry");
    if (rt) rt.onclick = () => startTest(mistakes.map(m => byBase[m.base]), mistakes.length, "Opakovanie chýb");
    d.querySelector("#again").onclick = testMenu;
    d.querySelector("#home").onclick = home;
  };
  ask();
}

function historyView(backFn) {
  const tests = [...store.tests].reverse();
  const n = tests.length;
  const avg = n ? Math.round(tests.reduce((s, t) => s + t.pct, 0) / n) : 0;
  const best = n ? Math.max(...tests.map(t => t.pct)) : 0;
  const errors = {};
  tests.forEach(t => (t.items || []).forEach(it => { if (!it.ok) errors[it.base] = (errors[it.base] || 0) + 1; }));
  const topErr = Object.entries(errors).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const when = t => t.ts ? new Date(t.ts).toLocaleString("sk-SK", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }) : fmtDate(t.date);
  const form = b => { const v = byBase[b]; return v ? `${showForm(v.base)} – ${showForm(v.past)} – ${showForm(v.pp)}` : b; };
  const TYPE = { type: "písanie", choice: "výber tvaru", meaning: "preklad" };
  const d = render(`

    <p class="muted">Všetky testy sa ukladajú trvalo a nemažú sa.</p>
    <div class="card"><div class="row">
      <div class="stat"><b>${n}</b><span>testov celkom</span></div>
      <div class="stat"><b>${n ? avg + " %" : "–"}</b><span>priemer</span></div>
      <div class="stat"><b>${n ? best + " %" : "–"}</b><span>najlepší test</span></div>
    </div></div>
    ${topErr.length ? `<div class="card"><h3 style="margin-top:0">Najčastejšie chyby zo všetkých testov</h3>
      ${topErr.map(([b, c]) => `<div class="mistake"><b>${form(b)}</b> <span class="muted">(${byBase[b] ? byBase[b].sk : ""}) · ${c}× chyba</span></div>`).join("")}</div>` : ""}
    ${n ? tests.map(t => `<details class="card">

            <div style="text-align:right;white-space:nowrap"><span class="big g${t.grade}" style="font-size:1.6rem">${t.pct} %</span><br>

          </div>
        </summary>
        ${(() => {
          const items = t.items || [], bad = items.filter(it => !it.ok), good = items.filter(it => it.ok);

          if (!t.items) return t.mistakes && t.mistakes.length ? `<h4 style="margin:6px 0">Zle (${t.mistakes.length})</h4>` + t.mistakes.map(b => `<div class="mistake"><b>${form(b)}</b></div>`).join("") : "<span class='muted'>Bez chýb.</span>";
          return (bad.length ? `<h4 style="margin:6px 0">❌ Zle (${bad.length})</h4>` + bad.map(it => `<div class="mistake"><b>${it.base}</b> – ${byBase[it.base] ? byBase[it.base].sk : ""} <span class="muted">(${TYPE[it.type]}${hintTag(it)})</span><br>
              <span class="muted">odpoveď:</span> ${it.given}<br><span class="muted">správne:</span> <b>${form(it.base)}</b></div>`).join("") : `<div class="okline">Žiadna chyba! 🌟</div>`)
            + (good.length ? `<h4 style="margin:12px 0 6px">✅ Správne (${good.length})</h4>` + good.map(it => `<div class="okline"><b>${it.base}</b> <span class="muted">(${TYPE[it.type]}${hintTag(it)})</span></div>`).join("") : "");

  d.querySelector("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(store, null, 2)], { type: "application/json" }));
    a.download = "barbi-postup-" + today() + ".json"; a.click();
  };
  d.querySelector("#hist2").onclick = () => historyView(progress);
}

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
home();
