<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pozdravy a frázy · Barbi učenie</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(150deg,#ffe9f5,#eae2ff);color:#322346}main{max-width:750px;margin:0 auto;padding:22px 16px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}a{color:#7442d9;text-decoration:none;font-weight:700}.panel{background:white;border-radius:24px;padding:26px;box-shadow:0 9px 25px #62448418;min-height:350px}h1{font-size:1.6rem;color:#7442d9}h2{font-size:1.4rem}p{line-height:1.55}.muted{color:#786b89}.progress{height:9px;border-radius:20px;background:#eae0ff;margin:18px 0;overflow:hidden}.progress div{height:100%;background:#8453e9;transition:width .2s}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.term{padding:10px 13px;background:#f8f3ff;border-radius:14px;margin:9px 0}.term b{font-size:1.08rem}.term small{display:block;color:#746a83}.voice{padding:8px 12px;background:#ede4ff;color:#5734a6;border:0;border-radius:12px}.primary,.option{font:inherit;border:0;border-radius:14px;padding:13px 18px;cursor:pointer}.primary{background:#7545df;color:white;font-weight:700;margin-top:18px}.option{background:#f3edff;color:#392454;width:100%;text-align:left;margin:7px 0;border:2px solid transparent}.option.chosen{border-color:#7545df;background:#e9ddff}.option:disabled{opacity:.8}.primary:disabled{opacity:.45;cursor:default}input{font:inherit;width:100%;padding:13px;border:2px solid #d8c6f5;border-radius:12px}.feedback{background:#f6f0ff;border-radius:13px;padding:13px;margin-top:16px}.pill{font-size:.85rem;color:#7545df;font-weight:700}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffb900;outline-offset:2px}@media(max-width:520px){main{padding:14px 12px}.panel{padding:18px}header h1{font-size:1.2rem}}</style></head><body><main><header><a href="spanielcina.html">← Všetky lekcie</a><h1>🇪🇸 Pozdravy a frázy</h1></header><div class="row"><span class="pill" id="counter">1</span><span class="muted">Barbi učenie 💜</span></div><div class="progress"><div id="bar"></div></div><section class="panel" id="panel"><h2>Načítavam lekciu…</h2></section></main><script>(function(){
"use strict";
const DATA={"title":"Pozdravy a frázy","groups":[[["Hola","Ahoj","ola"],["Buenos días","Dobré ráno / dobrý deň","buenos días"],["Buenas tardes","Dobré popoludnie","buenas tardes"]],[["Buenas noches","Dobrý večer / dobrú noc","buenas nočes"],["Adiós","Dovidenia","adiós"],["Hasta luego","Uvidíme sa neskôr","asta luego"]],[["¿Cómo estás?","Ako sa máš?","komo estás"],["Estoy bien, gracias.","Mám sa dobre, ďakujem.","estoj bjen, grasjas"],["¿Cómo te llamas?","Ako sa voláš?","komo te jamas"]],[["Me llamo Barbora.","Volám sa Barbora.","me jamo Barbora"],["¿De dónde eres?","Odkiaľ si?","de donde eres"],["Soy de Eslovaquia.","Som zo Slovenska.","soj de eslovakja"]],[["Mucho gusto","Teší ma","mučo gusto"],["Gracias","Ďakujem","grasjas"],["Por favor","Prosím","por fabor"]]],"id":1};
const KEY="barbi-spanish-v2-"+DATA.id;
const panel=document.getElementById("panel"),counter=document.getElementById("counter"),bar=document.getElementById("bar");
let stages=[],at=0,selected=null,checked=false,correct=0,errors=[],review=false;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s){return String(s).toLocaleLowerCase("sk").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim()}
function makeStages(){stages=[];DATA.groups.forEach((g,gi)=>{stages.push({kind:"learn",gi});g.forEach((v,vi)=>stages.push({kind:"quiz",gi,vi,type:(vi+gi)%2===0?"pick":"write"}))})}
function speak(value,slow){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);u.lang="es-ES";u.rate=slow?.7:.9;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==="es-es")||voices.find(v=>v.lang.toLowerCase().startsWith("es"));if(voice)u.voice=voice;window.speechSynthesis.speak(u)}
function voices(s){return '<button class="voice" data-speak="'+safe(s)+'">🔊</button>'}
function show(){const st=stages[at];selected=null;checked=false;counter.textContent=(at+1)+" / "+stages.length;bar.style.width=(at/stages.length*100)+"%";
if(st.kind==="learn"){const g=DATA.groups[st.gi];let intro=DATA.id===3?["SER = byť","TENER = mať","LLAMARSE = volať sa"][st.gi]:"Najprv si pozri tieto výrazy a vypočuj výslovnosť.";
panel.innerHTML='<span class="pill">📖 VYSVETLENIE · časť '+(st.gi+1)+' / '+DATA.groups.length+'</span><h2>'+safe(intro)+'</h2><p class="muted">Pozri si jednotlivé tvary. Potom ich budeme precvičovať po jednom.</p>'+g.map(v=>'<div class="term row"><div><b>'+safe(v[0])+'</b><div>'+safe(v[1])+'</div><small>Približne: '+safe(v[2])+'</small></div>'+voices(v[0])+'</div>').join("")+'<button class="primary" id="next">Rozumiem, poďme na otázky →</button>';return}
const v=DATA.groups[st.gi][st.vi];let options="";if(st.type==="pick"){let all=DATA.groups[st.gi].map(x=>x[0]).filter(x=>x!==v[0]);if(all.length<2)all=DATA.groups.flat().map(x=>x[0]).filter(x=>x!==v[0]);let answers=[v[0],...all.slice(0,2)];answers=answers.sort((a,b)=>((a.length*13+st.vi*7)%17)-((b.length*13+st.vi*7)%17));options=answers.map((a,k)=>'<button class="option" data-choice="'+k+'" data-value="'+safe(a)+'">'+safe(a)+'</button>').join("")}else options='<input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Napíš po španielsky...">';
panel.innerHTML='<span class="pill">✏️ OTÁZKA · '+(st.vi+1)+' / '+DATA.groups[st.gi].length+'</span><h2>Ako sa po španielsky povie:</h2><h2 style="color:#7442d9">'+safe(v[1])+'?</h2>'+options+'<div id="feedback" aria-live="polite"></div><button class="primary" id="check" disabled>Skontrolovať ✓</button>';
const input=document.getElementById("answer");if(input){input.addEventListener("input",()=>document.getElementById("check").disabled=!input.value.trim());input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!document.getElementById("check").disabled)document.getElementById("check").click()})}
}
function next(){at++;if(at>=stages.length){finish();return}show()}
function check(){if(checked){next();return}const st=stages[at],v=DATA.groups[st.gi][st.vi];const input=document.getElementById("answer");const response=input?input.value:selected;const ok=norm(response)===norm(v[0]);checked=true;if(ok){correct++}else if(!review){errors.push({gi:st.gi,vi:st.vi,type:st.type})}document.getElementById("feedback").innerHTML='<div class="feedback">'+(ok?'🌟 Výborne, správne!':'💜 Nevadí, správna odpoveď je: <b>'+safe(v[0])+'</b>')+' <span>'+voices(v[0])+'</span></div>';const b=document.getElementById("check");b.disabled=false;b.textContent="Ďalej →";if(input)input.disabled=true;panel.querySelectorAll("[data-choice]").forEach(b=>b.disabled=true)}
function finish(){if(errors.length&&!review){review=true;stages=errors.map(x=>({kind:"quiz",...x}));at=0;errors=[];panel.innerHTML='<h2>💜 Ešte malé opakovanie</h2><p>Niektoré odpovede si precvičíme ešte raz. Bez stresu!</p><button class="primary" id="review">Ideme na to →</button>';counter.textContent="Opakovanie";bar.style.width="100%";return}
try{localStorage.setItem(KEY,JSON.stringify({completed:Date.now(),correct}))}catch(e){}
counter.textContent="Hotovo";bar.style.width="100%";panel.innerHTML='<div style="font-size:3rem">🎉</div><h2>¡Fantástico, Barbi!</h2><p>Prešla si celú lekciu. Každým pokusom sa zlepšuješ!</p><button class="primary" id="restart">Zopakovať lekciu</button> <a style="display:inline-block;margin:20px" href="spanielcina.html">Všetky lekcie →</a>'}
panel.addEventListener("click",e=>{const speakBtn=e.target.closest("[data-speak]");if(speakBtn){speak(speakBtn.getAttribute("data-speak"));return}const option=e.target.closest("[data-choice]");if(option&&!checked){selected=option.getAttribute("data-value");panel.querySelectorAll("[data-choice]").forEach(b=>b.classList.toggle("chosen",b===option));document.getElementById("check").disabled=false;return}const btn=e.target.closest("button");if(!btn)return;if(btn.id==="next")next();if(btn.id==="check")check();if(btn.id==="review")show();if(btn.id==="restart"){review=false;errors=[];correct=0;at=0;makeStages();show()}});
makeStages();show();
})();</script></body></html>
